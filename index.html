<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PagePebble - Your Webpage Sticky Notes Reimagined</title>
    <style>
        /* Basic Reset & Defaults */
        :root {
            --primary-blue: #4A729D; /* Extracted from logo's blueish bg */
            --accent-yellow: #F2C057; /* Extracted from logo's yellow note */
            --dark-text: #333;
            --light-text: #f8f9fa;
            --bg-light: #f8f9fa;
            --bg-medium: #e9ecef;
            --border-radius: 8px;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* ... (ALL YOUR EXISTING CSS RULES GO HERE, UNCHANGED) ... */
        /* ... up to and including the @media queries ... */

        /* Privacy Policy Modal & Contact Form Modal (SHARED STYLES) */
        .modal-overlay { /* This rule was already there, ensure it has display: none; */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none; /* Hidden by default - THIS IS KEY */
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content { /* This rule was already there */
            background-color: #fff;
            padding: 30px 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-content h2 { /* This rule was already there */
            color: var(--primary-blue);
            margin-bottom: 20px;
        }
        .modal-content h3 { /* This rule was already there */
            color: var(--primary-blue);
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        .modal-content p, .modal-content ul { /* This rule was already there */
            margin-bottom: 15px;
            line-height: 1.8;
        }
        .modal-content ul { /* This rule was already there */
            padding-left: 20px;
        }

        .close-modal { /* This rule was already there */
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2em;
            color: var(--dark-text);
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
        }
        .close-modal:hover { /* This rule was already there */
            color: var(--accent-yellow);
        }

        /* ... (any other CSS rules like .contact-section, footer, etc.) ... */

    </style>
</head>
<body>

    <header>
        <!-- ... (Your header HTML - UNCHANGED) ... -->
    </header>

    <main>
        <!-- ... (Your main content sections: hero, features, early-access, contact - UNCHANGED) ... -->
        <!-- The links within these sections should have the correct IDs: -->
        <!-- e.g., id="show-contact-form-feedback-link" and id="show-contact-form-contact-link" -->
        <!-- e.g., id="show-privacy-link" and id="show-privacy-link-footer" -->
    </main>

    <footer>
        <!-- ... (Your footer HTML - UNCHANGED) ... -->
    </footer>

    <!-- MODAL HTML STRUCTURES GO HERE - OUTSIDE <style>, INSIDE <body>, BEFORE <script> -->

    <!-- Privacy Policy Modal Structure -->
    <div id="privacy-policy-modal" class="modal-overlay"> <!-- Ensure class="modal-overlay" is here -->
        <div class="modal-content">
            <button class="close-modal" id="close-privacy-modal-button" aria-label="Close privacy policy">×</button>
            <h2>Privacy Policy for PagePebble</h2>
            <!-- ... (REST OF YOUR PRIVACY POLICY CONTENT - UNCHANGED) ... -->
        </div>
    </div>

    <!-- Contact/Feedback Form Modal Structure -->
    <div id="contact-form-modal" class="modal-overlay"> <!-- Ensure class="modal-overlay" is here -->
        <div class="modal-content">
            <button class="close-modal" id="close-contact-form-modal-button" aria-label="Close contact form">×</button>
            <h2>Share Feedback or Contact Us</h2>
            <p style="text-align: center; margin-bottom: 25px;">We'd love to hear from you!</p>
            <form id="contactFormInModal" action="https://formspree.io/f/xovdbggz" method="POST" style="text-align: left;">
                <!-- ... (REST OF YOUR FORM FIELDS - UNCHANGED) ... -->
                 <p id="modal-form-status" style="text-align: center; margin-top: 10px; font-size: 0.9em;"></p>
                <div style="text-align: center; margin-top:10px;">
                    <button type="submit" class="cta-button" style="background-color: var(--primary-blue); color: var(--light-text); padding: 12px 25px;">Send Message</button>
                </div>
                 <p style="text-align: center; font-size: 0.8em; color: #777; margin-top: 15px;">
                    (You will be briefly redirected to Formspree to confirm submission if JavaScript for AJAX fails or is disabled.)
                </p>
            </form>
        </div>
    </div>


    <script>
        // --- START: Ensure this entire script block is correct and not duplicated ---

        // Set current year in footer
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        // Set effective date for privacy policy
        const today = new Date();
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        if (document.getElementById('effective-date')) { // Check if element exists
            document.getElementById('effective-date').textContent = monthNames[today.getMonth()] + " " + today.getDate() + ", " + today.getFullYear();
        }

        // Privacy Policy Modal Logic
        const privacyModal = document.getElementById('privacy-policy-modal');
        const showPrivacyLinks = document.querySelectorAll('#show-privacy-link, #show-privacy-link-footer');
        const closePrivacyButton = document.getElementById('close-privacy-modal-button');

        function openPrivacyModal() { // Renamed for clarity
            if (privacyModal) {
                privacyModal.style.display = 'flex';
                privacyModal.querySelector('.modal-content').scrollTop = 0;
            }
        }

        function closePrivacyModal() { // Renamed for clarity
            if (privacyModal) {
                privacyModal.style.display = 'none';
            }
        }

        if (showPrivacyLinks.length > 0 && privacyModal) {
            showPrivacyLinks.forEach(link => {
                link.addEventListener('click', function(event) {
                    event.preventDefault();
                    openPrivacyModal();
                    if (history.pushState) {
                        history.pushState(null, null, '#privacy-policy');
                    } else {
                        window.location.hash = 'privacy-policy';
                    }
                });
            });
        }
        
        if (closePrivacyButton) {
            closePrivacyButton.addEventListener('click', () => {
                closePrivacyModal();
                if (history.pushState) { history.pushState(null, null, window.location.pathname + window.location.search); } else { window.location.hash = '';}
            });
        }

        if (privacyModal) {
            privacyModal.addEventListener('click', function(event) {
                if (event.target === privacyModal) {
                    closePrivacyModal();
                    if (history.pushState) { history.pushState(null, null, window.location.pathname + window.location.search); } else { window.location.hash = '';}
                }
            });

            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && privacyModal.style.display === 'flex') {
                    closePrivacyModal();
                    if (history.pushState) { history.pushState(null, null, window.location.pathname + window.location.search); } else { window.location.hash = '';}
                }
            });
        }
        
        if (window.location.hash === '#privacy-policy' || window.location.hash === '#privacy-policy-modal') {
            if (privacyModal) openPrivacyModal();
        }

        // Contact/Feedback Form Modal Logic
        const contactFormModal = document.getElementById('contact-form-modal');
        const showContactFormLinks = document.querySelectorAll('#show-contact-form-feedback-link, #show-contact-form-contact-link'); // This is the correct variable
        const closeContactFormButton = document.getElementById('close-contact-form-modal-button');
        const contactFormInModalElement = document.getElementById('contactFormInModal'); 
        const modalFormStatusElement = document.getElementById('modal-form-status'); 

        function openContactFormModal() {
            if (contactFormModal) {
                contactFormModal.style.display = 'flex';
                contactFormModal.querySelector('.modal-content').scrollTop = 0; 
                if (modalFormStatusElement) {
                    modalFormStatusElement.textContent = '';
                    modalFormStatusElement.style.color = ''; 
                }
            }
        }

        function closeContactFormModal() {
            if (contactFormModal) {
                contactFormModal.style.display = 'none';
            }
        }

        if (showContactFormLinks.length > 0 && contactFormModal) { // Ensure links and modal exist
            showContactFormLinks.forEach(link => {
                link.addEventListener('click', function(event) {
                    event.preventDefault(); 
                    openContactFormModal();
                    if (history.pushState) {
                        history.pushState(null, null, '#contact-us'); 
                    } else {
                        window.location.hash = 'contact-us';
                    }
                });
            });
        }

        if (closeContactFormButton) { 
            closeContactFormButton.addEventListener('click', () => {
                closeContactFormModal();
                if (history.pushState) { history.pushState(null, null, window.location.pathname + window.location.search); } else { window.location.hash = '';}
            });
        }

        if (contactFormModal) {
            contactFormModal.addEventListener('click', function(event) {
                if (event.target === contactFormModal) {
                    closeContactFormModal();
                    if (history.pushState) { history.pushState(null, null, window.location.pathname + window.location.search); } else { window.location.hash = '';}
                }
            });
        
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && contactFormModal.style.display === 'flex') {
                    closeContactFormModal();
                    if (history.pushState) { history.pushState(null, null, window.location.pathname + window.location.search); } else { window.location.hash = '';}
                }
            });
        }

        if (window.location.hash === '#contact-us' || window.location.hash === '#feedback' || window.location.hash === '#contact-form-modal') {
            if (contactFormModal) openContactFormModal();
        }
        
        if (contactFormInModalElement && modalFormStatusElement) { // Ensure form and status elements exist
            contactFormInModalElement.addEventListener("submit", async function(event) {
                event.preventDefault(); 
                
                const form = event.target;
                const data = new FormData(form);
                const statusElement = modalFormStatusElement;

                statusElement.textContent = "Sending...";
                statusElement.style.color = "var(--primary-blue)";

                try {
                    const response = await fetch(form.action, {
                        method: form.method,
                        body: data,
                        headers: { 'Accept': 'application/json' }
                    });

                    if (response.ok) {
                        statusElement.textContent = "Thanks for your message! We'll be in touch soon.";
                        statusElement.style.color = "green";
                        form.reset(); 
                        // setTimeout(() => { closeContactFormModal(); if (history.pushState) { history.pushState(null, null, window.location.pathname + window.location.search); }}, 3000);
                    } else {
                        const responseData = await response.json().catch(() => ({})); // Gracefully handle non-JSON error responses
                        if (responseData.errors && responseData.errors.length > 0) {
                            statusElement.textContent = responseData.errors.map(error => error.message || 'Unknown error').join(", ");
                        } else {
                            statusElement.textContent = "Oops! There was a problem submitting your form. Please try again.";
                        }
                        statusElement.style.color = "red";
                    }
                } catch (error) {
                    console.error("Form submission error:", error); // Log the actual error
                    statusElement.textContent = "Oops! There was a network error. Please check your connection.";
                    statusElement.style.color = "red";
                }
            });
        }
        // --- END: Ensure this entire script block is correct and not duplicated ---
    </script>
</body>
</html>
